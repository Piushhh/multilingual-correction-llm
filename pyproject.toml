[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-correction-llm"
version = "0.1.0"
description = "Multilingual domain-aware document correction research project"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests that take longer than 5 seconds (deselect with -m 'not slow')",
    "ocr: marks tests that require a live Tesseract installation",
]
